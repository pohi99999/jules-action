name: Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Jules Invoke (Dry Run)
        uses: ./
        with:
          prompt: "This is a test prompt to verify the action workflow."
          jules_api_key: "dummy-key"
          dry_run: true

      - name: Verify Payload Generation
        run: |
          if [ ! -f jules_payload.json ]; then
            echo "Error: jules_payload.json was not generated"
            exit 1
          fi
          if [ ! -s jules_payload.json ]; then
            echo "Error: jules_payload.json is empty"
            exit 1
          fi
          # Basic JSON structure validation
          jq . jules_payload.json
